name = "rasengames"
main = "src/index.ts"
compatibility_date = "2025-08-01"

[assets]
directory = "./public"
binding = "ASSETS"
# Static files are served first; requests that don't match a file (e.g. /ws/*)
# fall through to the Worker's fetch handler below.

[[durable_objects.bindings]]
name = "UNDERCOVER_ROOM"
class_name = "UndercoverRoom"

[[durable_objects.bindings]]
name = "HUNDRED_ROOM"
class_name = "HundredRoom"

[[durable_objects.bindings]]
name = "BAC_ROOM"
class_name = "BacRoom"

[[durable_objects.bindings]]
name = "WHOAMI_ROOM"
class_name = "WhoamiRoom"

[[durable_objects.bindings]]
name = "DETECTIVE_ROOM"
class_name = "DetectiveRoom"

[[durable_objects.bindings]]
name = "NOTE_ROOM"
class_name = "NoteRoom"

[[durable_objects.bindings]]
name = "BOMB_ROOM"
class_name = "BombRoom"

[[durable_objects.bindings]]
name = "CODENAMES_ROOM"
class_name = "CodenamesRoom"

[[durable_objects.bindings]]
name = "SYNC_ROOM"
class_name = "SyncRoom"

[[durable_objects.bindings]]
name = "GUESSWHO_ROOM"
class_name = "GuessWhoRoom"

[[durable_objects.bindings]]
name = "PARTY_ROOM"
class_name = "PartyRoom"

[[durable_objects.bindings]]
name = "LOBBY_REGISTRY"
class_name = "LobbyRegistry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UndercoverRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["HundredRoom"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["BacRoom"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["WhoamiRoom", "DetectiveRoom"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["NoteRoom"]

[[migrations]]
tag = "v6"
new_sqlite_classes = ["LobbyRegistry"]

[[migrations]]
tag = "v7"
new_sqlite_classes = ["BombRoom"]

[[migrations]]
tag = "v8"
new_sqlite_classes = ["CodenamesRoom"]

[[migrations]]
tag = "v9"
new_sqlite_classes = ["SyncRoom"]

[[migrations]]
tag = "v10"
new_sqlite_classes = ["GuessWhoRoom"]

[[migrations]]
tag = "v11"
new_sqlite_classes = ["PartyRoom"]

# Custom domain: once reesch.com is active on this Cloudflare account,
# uncomment and deploy again (or attach the route from the dashboard).
# routes = [
#   { pattern = "rasengames.reesch.com", custom_domain = true }
# ]
